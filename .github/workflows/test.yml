name: Tests and demo reports
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python run_report.py examples/synthetic_excess.csv --strategies Quality Trend Defensive Value --unit decimal --return-type excess --fee-status unknown --out outputs/excess
      - run: python run_report.py examples/synthetic_total.csv --strategies Quality Trend Defensive Value --unit decimal --return-type total --rf-column cash --fee-status unknown --out outputs/total
